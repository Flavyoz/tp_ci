name: CI

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t tp-ci-image .

      - name: Lancer les tests unitaires dans le conteneur
        run: docker run --rm tp-ci-image

      - name: Lancer job.py dans le conteneur
        run: docker run --rm -e SECRET_API_TOKEN=${{ secrets.SECRET_API_TOKEN }} tp-ci-image python job.py